      <nav id="menu-principale" class="menu" aria-label="Menu principale">
        <ul>
          {% for voce in site.data.navigazione %}
          {% assign attiva = false %}
          {% if voce.url == '/' %}
            {% if page.url == '/' %}{% assign attiva = true %}{% endif %}
          {% elsif page.url contains voce.url %}
            {% assign attiva = true %}
          {% endif %}
          <li><a href="{{ voce.url | relative_url }}"{% if attiva %} aria-current="page"{% endif %}>{{ voce.titolo }}</a></li>
          {% endfor %}
        </ul>
      </nav>
